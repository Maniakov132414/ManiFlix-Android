name: Build & Release ManiFlix Android APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Verify Android SDK 35 & Build Tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate deterministic release keystore
        run: |
          mkdir -p /tmp/keystore
          keytool -genkeypair -v \
            -keystore /tmp/keystore/maniflix-release.jks \
            -alias maniflix \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "ManiFlixRelease2026!" \
            -keypass "ManiFlixRelease2026!" \
            -dname "CN=Maniakov, OU=ManiFlix, O=Maniakov, L=HoChiMinh, ST=HCM, C=VN"

      - name: Build release APKs with Gradle
        env:
          KEYSTORE_PATH: /tmp/keystore/maniflix-release.jks
          KEYSTORE_PASSWORD: ManiFlixRelease2026!
          KEY_ALIAS: maniflix
          KEY_PASSWORD: ManiFlixRelease2026!
        run: |
          gradle assembleMobileRelease assembleTvRelease --no-daemon --stacktrace

      - name: Align, sign (v1+v2+v3), and package APKs into dist/
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          mkdir -p dist /tmp/aligned

          sign_apk() {
            local apk_dir="$1"
            local pattern="$2"
            local out_name="$3"
            local src
            src=$(find "$apk_dir" -maxdepth 1 -name "$pattern" | head -n 1)
            if [ -z "$src" ]; then
              echo "ERROR: Could not find APK matching $pattern in $apk_dir"
              ls -la "$apk_dir" || true
              exit 1
            fi
            echo "Found $src -> dist/$out_name"
            local aligned="/tmp/aligned/$out_name"
            if "$ZIPALIGN" -c -p 4 "$src" >/dev/null 2>&1; then
              cp "$src" "$aligned"
            else
              "$ZIPALIGN" -f -p 4 "$src" "$aligned"
            fi
            "$APKSIGNER" sign \
              --ks /tmp/keystore/maniflix-release.jks \
              --ks-key-alias maniflix \
              --ks-pass pass:"ManiFlixRelease2026!" \
              --key-pass pass:"ManiFlixRelease2026!" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "dist/$out_name" \
              "$aligned"
          }

          sign_apk "app/build/outputs/apk/mobile/release" "app-mobile-universal-release*.apk" "ManiFlix.apk"
          sign_apk "app/build/outputs/apk/tv/release" "app-tv-universal-release*.apk" "ManiFlix-AndroidTV.apk"
          ls -lh dist/

      - name: Verify APKs with apksigner and Python inspector
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT2="$BUILD_TOOLS/aapt2"

          for apk_file in dist/*.apk; do
            echo "=== apksigner verify: $apk_file ==="
            "$APKSIGNER" verify --verbose "$apk_file"
          done

          MOBILE_BADGING=$("$AAPT2" dump badging "dist/ManiFlix.apk")
          TV_BADGING=$("$AAPT2" dump badging "dist/ManiFlix-AndroidTV.apk")
          echo "=== Mobile package ==="
          echo "$MOBILE_BADGING" | grep -E "package:|application-label:|launchable-activity" || true
          echo "=== TV package ==="
          echo "$TV_BADGING" | grep -E "package:|application-label:|leanback|application-banner|launchable-activity" || true

          echo "$MOBILE_BADGING" | grep -q "name='bond.maniakov.maniflix'"
          echo "$TV_BADGING" | grep -q "name='bond.maniakov.maniflix.tv'"
          echo "$TV_BADGING" | grep -q "LEANBACK_LAUNCHER\|leanback"
          echo "$TV_BADGING" | grep -q "application-banner"

          python3 - << 'PY'
          import hashlib
          import pathlib
          import zipfile

          apks = sorted(pathlib.Path("dist").glob("*.apk"))
          assert [a.name for a in apks] == ["ManiFlix-AndroidTV.apk", "ManiFlix.apk"], (
              f"Expected ManiFlix-AndroidTV.apk and ManiFlix.apk, got {[a.name for a in apks]}"
          )

          hashes = set()
          for apk in apks:
              raw = apk.read_bytes()
              hashes.add(hashlib.sha256(raw).hexdigest())
              assert b"APK Sig Block 42" in raw, f"{apk.name}: missing APK Signature Scheme v2/v3 block"
              with zipfile.ZipFile(apk, "r") as zf:
                  bad = zf.testzip()
                  assert bad is None, f"{apk.name}: corrupt ZIP entry {bad}"
                  names = zf.namelist()
                  assert "AndroidManifest.xml" in names, f"{apk.name}: missing AndroidManifest.xml"
                  if apk.name == "ManiFlix-AndroidTV.apk":
                      assert any("tv_banner" in n for n in names), f"{apk.name}: missing tv_banner drawable"
                  dex_files = [n for n in names if n.startswith("classes") and n.endswith(".dex")]
                  assert len(dex_files) >= 1, f"{apk.name}: missing classes.dex"
                  rsa_files = [n for n in names if n.startswith("META-INF/") and n.endswith((".RSA", ".DSA", ".EC"))]
                  assert rsa_files, f"{apk.name}: missing v1 signature certificate in META-INF"
                  abis = sorted({n.split("/")[1] for n in names if n.startswith("lib/") and len(n.split("/")) >= 3})
                  for expected_abi in ("arm64-v8a", "armeabi-v7a", "x86", "x86_64"):
                      assert expected_abi in abis, f"{apk.name}: missing ABI {expected_abi}, got {abis}"
                  print(
                      f"PASS {apk.name}: size={len(raw)} bytes ({len(raw)/1024/1024:.2f}MB) "
                      f"dex={len(dex_files)} v1={rsa_files[0]} v2/v3=True abis={abis}"
                  )
          assert len(hashes) == 2, "Expected distinct compiled APKs for mobile vs tv flavors!"
          PY

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maniflix-apk
          path: dist/*.apk

      - name: Publish GitHub Release v1.1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: ManiFlix Android v1.1.0
          body: |
            ManiFlix Native Android & Android TV v1.1.0 (Build 8)
            - Hỗ trợ Android TV / Google TV / TV Box (Viettel TV360, Mi Box...): Leanback Launcher, banner TV 320x180, tự động nhận diện TV / D-Pad và mục chọn chế độ TV/Điện thoại trong Cài đặt
            - Giao diện 10-foot TV Leanback Compose chuyên dụng với điều hướng D-Pad mượt mà, thanh tìm kiếm kèm bàn phím nhanh D-Pad, trang chi tiết & chọn tập bằng remote
            - Điều khiển trình phát bằng remote TV (DPAD_CENTER/ENTER, trái/phải tua nhanh, lên/xuống hiện HUD, phím Media, Back) & tự giữ hướng ngang trên TV/máy tính bảng
            - Tối ưu 60/120fps cho Android & TV Box chip yếu (Coil RGB_565 trên TV/RAM thấp, cache giới hạn, kích thước ảnh chuẩn, bỏ blur toàn màn hình)
            - `ManiFlix.apk` & `ManiFlix-AndroidTV.apk`: Bản Universal đa kiến trúc (`arm64-v8a`, `armeabi-v7a`, `x86`, `x86_64`) tương thích Android 7.0+ (Điện thoại, Tablet & Android TV)
          files: dist/*.apk
          overwrite_files: true
          make_latest: true
